<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#205d9e"><title>車流量調查紀錄</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#182638;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 16px}header{margin-bottom:24px}h1{font-size:28px;margin:0 0 6px}h2{font-size:20px;margin:0 0 16px}p{line-height:1.6;color:#526275}section{background:white;border:1px solid #dce4ed;border-radius:16px;padding:20px;margin-bottom:16px}button,input,select{font:inherit;border-radius:10px}button{cursor:pointer;border:1px solid #ccd6e2;background:white;color:#20344b;padding:12px 16px;touch-action:manipulation}button:active{transform:scale(.98)}button:focus-visible{outline:3px solid #94bfff}button.primary{background:#205d9e;color:white;border:0;font-weight:700}label{display:block;font-weight:600;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #bac8d8;background:white;color:#182638}.fields,.actions{display:flex;gap:12px;flex-wrap:wrap}.fields>div{flex:1;min-width:130px}.actions{margin-top:16px}.actions button{flex:1} .countergrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.vehicle{border:0;color:white;width:100%;min-height:155px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;user-select:none}.vehicle strong{font-size:52px;font-variant-numeric:tabular-nums;line-height:1.1}.vehicle small{font-weight:400}.car{background:#215d9e}.motor{background:#087c70}.truck{background:#a65b15}.minus{width:100%;margin-top:8px}.total{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}.muted{font-size:14px;color:#526275}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:14px}th,td{padding:12px 8px;text-align:right;border-bottom:1px solid #e1e7ee}th:first-child,td:first-child{text-align:left}th{background:#f1f5f9}td button{padding:6px 9px;font-size:13px}.danger{color:#a12424}.notice{background:#fff4df;border:1px solid #e5c58d;padding:12px;border-radius:10px;color:#795019;margin-bottom:16px}.hidden{display:none!important}@media(max-width:480px){main{padding:16px 10px}section{padding:14px}.countergrid{gap:7px}.vehicle{min-height:140px;padding:8px;font-size:17px}.vehicle strong{font-size:42px}.vehicle small{font-size:12px}h1{font-size:24px}}
.hourgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.hourbtn{min-height:48px;padding:8px 3px;font-size:14px;font-weight:600}.hourbtn[aria-pressed="true"]{background:#205d9e;color:white;border-color:#205d9e}@media(max-width:480px){.hourgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
button{ -webkit-tap-highlight-color:transparent } .vehicle{min-height:clamp(155px,25vh,280px)} main{padding-bottom:max(24px,env(safe-area-inset-bottom))} #file[hidden]{display:none} </style></head><body><main><header><h1>車流量調查紀錄</h1><div class="muted">離線逐時紀錄 · 小客車／機車／貨車</div><div id="offline" class="muted" role="status">正在確認離線功能…</div></header><div id="warning" class="notice hidden" role="alert"></div><div id="home"><section><h2>新增逐時紀錄</h2><div class="fields"><div><label for="date">紀錄日期</label><input type="date" id="date"></div></div><div style="margin-top:16px"><label>紀錄時段（點選一個小時）</label><div id="hourgrid" class="hourgrid"><button type="button" class="hourbtn" data-hour="0" aria-pressed="false">00:00–01:00</button><button type="button" class="hourbtn" data-hour="1" aria-pressed="false">01:00–02:00</button><button type="button" class="hourbtn" data-hour="2" aria-pressed="false">02:00–03:00</button><button type="button" class="hourbtn" data-hour="3" aria-pressed="false">03:00–04:00</button><button type="button" class="hourbtn" data-hour="4" aria-pressed="false">04:00–05:00</button><button type="button" class="hourbtn" data-hour="5" aria-pressed="false">05:00–06:00</button><button type="button" class="hourbtn" data-hour="6" aria-pressed="false">06:00–07:00</button><button type="button" class="hourbtn" data-hour="7" aria-pressed="false">07:00–08:00</button><button type="button" class="hourbtn" data-hour="8" aria-pressed="false">08:00–09:00</button><button type="button" class="hourbtn" data-hour="9" aria-pressed="false">09:00–10:00</button><button type="button" class="hourbtn" data-hour="10" aria-pressed="false">10:00–11:00</button><button type="button" class="hourbtn" data-hour="11" aria-pressed="false">11:00–12:00</button><button type="button" class="hourbtn" data-hour="12" aria-pressed="false">12:00–13:00</button><button type="button" class="hourbtn" data-hour="13" aria-pressed="false">13:00–14:00</button><button type="button" class="hourbtn" data-hour="14" aria-pressed="false">14:00–15:00</button><button type="button" class="hourbtn" data-hour="15" aria-pressed="false">15:00–16:00</button><button type="button" class="hourbtn" data-hour="16" aria-pressed="false">16:00–17:00</button><button type="button" class="hourbtn" data-hour="17" aria-pressed="false">17:00–18:00</button><button type="button" class="hourbtn" data-hour="18" aria-pressed="false">18:00–19:00</button><button type="button" class="hourbtn" data-hour="19" aria-pressed="false">19:00–20:00</button><button type="button" class="hourbtn" data-hour="20" aria-pressed="false">20:00–21:00</button><button type="button" class="hourbtn" data-hour="21" aria-pressed="false">21:00–22:00</button><button type="button" class="hourbtn" data-hour="22" aria-pressed="false">22:00–23:00</button><button type="button" class="hourbtn" data-hour="23" aria-pressed="false">23:00–24:00</button></div><p id="selectedHour" class="muted">請選擇時段</p><input type="hidden" id="hour" value=""></div><noscript><p class="notice">目前的檔案預覽器未啟用 JavaScript，無法計數或儲存。請改用支援 JavaScript 的本機 HTML 瀏覽器開啟。</p></noscript><div class="actions"><button class="primary" id="start">開始計數</button><button id="resume" class="hidden">繼續未提交紀錄</button></div></section><section><h2>歷史紀錄</h2><div id="summary" class="muted"></div><div class="actions"><button id="export">匯出 CSV</button><button id="backup">備份 JSON</button><button id="restore">匯入備份</button><input id="file" type="file" accept=".json,application/json" hidden></div><div class="tablewrap"><table><thead><tr><th>日期／時段</th><th>小客車</th><th>機車</th><th>貨車</th><th>總計</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">資料儲存在此瀏覽器。請定期匯出或備份，避免清除瀏覽器資料或更換裝置造成遺失。</p></section></div><div id="count" class="hidden"><section><h2 id="period"></h2><div class="muted">每通過一輛車，點擊對應車種一次。誤按可按下方 −1。</div></section><section><div class="countergrid" id="buttons"></div><div style="margin-top:20px" class="muted">本時段總車輛數</div><div class="total" id="total" aria-live="polite">0</div><div class="actions"><button id="undo">復原上一步</button><button id="back">返回首頁（保留草稿）</button></div><div class="actions"><button class="primary" id="submit">提交本小時紀錄</button></div></section></div><div id="done" class="hidden"><section><h2>紀錄已提交</h2><p id="doneText"></p><div class="actions"><button class="primary" id="next">繼續紀錄下一小時</button><button id="goHome">返回首頁檢視紀錄</button></div></section></div></main><script>
'use strict';const $=id=>document.getElementById(id), key='traffic-counter-v1', names=['小客車','機車','貨車'], colors=['car','motor','truck'];let state={records:[],draft:null}, last=null;function warn(s){$('warning').textContent=s;$('warning').classList.toggle('hidden',!s)}try{const x=localStorage.getItem(key);if(x)state=JSON.parse(x);localStorage.setItem(key,JSON.stringify(state))}catch(e){warn('瀏覽器無法讀取或儲存本機資料。請勿關閉網頁，並在完成後匯出備份。')}
function save(){try{localStorage.setItem(key,JSON.stringify(state));return true}catch(e){warn('本機儲存失敗，資料暫存在目前網頁。請立即匯出備份，勿關閉網頁。');return false}}const pad=n=>String(n).padStart(2,'0'), dateStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, slot=h=>`${pad(h)}:00–${h===23?'24:00':pad(h+1)+':00'}`, sum=a=>a.reduce((s,n)=>s+n,0), ident=r=>r.date+' '+pad(r.hour), sorted=()=>[...state.records].sort((a,b)=>ident(a).localeCompare(ident(b)));function view(id){['home','count','done'].forEach(k=>$(k).classList.toggle('hidden',k!==id));window.scrollTo(0,0)}let now=new Date();$('date').value=dateStr(now);function selectHour(h){$('hour').value=h;document.querySelectorAll('.hourbtn').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.hour)===h)));$('selectedHour').textContent='已選擇：'+slot(h)}document.querySelectorAll('.hourbtn').forEach(b=>b.onclick=()=>selectHour(Number(b.dataset.hour)));selectHour(now.getHours());function home(){view('home');$('resume').classList.toggle('hidden',!state.draft);$('rows').replaceChildren();$('summary').textContent=`共 ${state.records.length} 筆逐時紀錄，累計 ${state.records.reduce((n,r)=>n+sum(r.counts),0)} 輛車。`;for(const r of sorted()){let tr=document.createElement('tr');for(const v of [r.date+' '+slot(r.hour),...r.counts,sum(r.counts)]){let td=document.createElement('td');td.textContent=v;tr.append(td)}let td=document.createElement('td'), edit=document.createElement('button'), del=document.createElement('button');edit.textContent='修改';edit.onclick=()=>begin(r.date,r.hour);del.textContent='刪除';del.className='danger';del.onclick=()=>{if(confirm('確定刪除此時段紀錄？')){state.records=state.records.filter(x=>ident(x)!==ident(r));save();home()}};td.append(edit,' ',del);tr.append(td);$('rows').append(tr)}if(!state.records.length){let tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='尚無已提交紀錄';tr.append(td);$('rows').append(tr)}}function begin(date,hour){if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('請輸入紀錄日期');return}let id=ident({date,hour});if(state.draft){if(ident(state.draft)===id){showCount();return}if(!confirm('已有其他時段的未提交紀錄。是否捨棄該草稿並開始新時段？'))return}let r=state.records.find(x=>ident(x)===id);if(r&&!confirm('此時段已有紀錄，是否載入原數據繼續修改？'))return;state.draft={date,hour,counts:r?[...r.counts]:[0,0,0],history:[]};save();showCount()}function showCount(){let d=state.draft;$('period').textContent=d.date+'　'+slot(d.hour);view('count');render()}function render(){let d=state.draft;d.counts.forEach((n,i)=>{$('n'+i).textContent=n;$('m'+i).disabled=n===0});$('total').textContent=sum(d.counts);$('undo').disabled=!d.history.length}function change(i,n){let d=state.draft;if(d.counts[i]+n<0)return;d.counts[i]+=n;d.history.push([i,n]);save();render()}names.forEach((name,i)=>{let box=document.createElement('div'),b=document.createElement('button'),m=document.createElement('button');b.className='vehicle '+colors[i];b.innerHTML=`<span>${name}</span><strong id="n${i}">0</strong><small>點擊 +1</small>`;b.onclick=()=>change(i,1);m.className='minus';m.id='m'+i;m.textContent='−1';m.setAttribute('aria-label',name+'減一');m.onclick=()=>change(i,-1);box.append(b,m);$('buttons').append(box)});$('undo').onclick=()=>{let d=state.draft;if(!d.history.length)return;let [i,n]=d.history.pop();d.counts[i]-=n;save();render()};$('start').onclick=()=>begin($('date').value,Number($('hour').value));$('resume').onclick=showCount;$('back').onclick=home;$('submit').onclick=()=>{let d=state.draft;if(!confirm(`提交 ${d.date} ${slot(d.hour)} 的紀錄（共 ${sum(d.counts)} 輛）？`))return;last={date:d.date,hour:d.hour,counts:[...d.counts]};state.records=state.records.filter(r=>ident(r)!==ident(last));state.records.push(last);state.draft=null;let ok=save();$('doneText').textContent=`${last.date} ${slot(last.hour)}：小客車 ${last.counts[0]}、機車 ${last.counts[1]}、貨車 ${last.counts[2]}，合計 ${sum(last.counts)} 輛。`+(ok?'':'（尚未成功儲存至瀏覽器）');view('done')};$('next').onclick=()=>{let [y,m,d]=last.date.split('-').map(Number),t=new Date(y,m-1,d,last.hour+1);begin(dateStr(t),t.getHours())};$('goHome').onclick=home;function download(name,data,type){let u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('export').onclick=()=>{if(!state.records.length){alert('尚無已提交紀錄');return}download('交通流量_'+dateStr(new Date())+'.csv','\uFEFF'+['日期,開始時間,結束時間,小客車,機車,貨車,總車輛數',...sorted().map(r=>[r.date,pad(r.hour)+':00',r.hour===23?'24:00':pad(r.hour+1)+':00',...r.counts,sum(r.counts)].join(','))].join('\r\n'),'text/csv;charset=utf-8')};$('backup').onclick=()=>download('交通流量備份_'+dateStr(new Date())+'.json',JSON.stringify(state,null,2),'application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let f=$('file').files[0];if(!f)return;let x=JSON.parse(await f.text());let valid=r=>r&&typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&Number.isInteger(r.hour)&&r.hour>=0&&r.hour<24&&Array.isArray(r.counts)&&r.counts.length===3&&r.counts.every(n=>Number.isSafeInteger(n)&&n>=0);if(!Array.isArray(x.records)||!x.records.every(valid)||(x.draft&&!valid(x.draft)))throw Error();if(!confirm('匯入備份將取代目前所有紀錄及草稿，確定繼續？'))return;state={records:[...new Map(x.records.map(r=>[ident(r),{date:r.date,hour:r.hour,counts:r.counts}])).values()],draft:x.draft?{date:x.draft.date,hour:x.draft.hour,counts:x.draft.counts,history:[]}:null};save();home()}catch(e){alert('無法匯入：備份格式不正確。')}finally{$('file').value=''}};home();

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('offline').textContent='離線快取已就緒；請先以飛航模式測試。'}).catch(()=>{$('offline').textContent='離線快取未啟用，請使用 HTTPS 網址開啟。'})}else{$('offline').textContent='此環境不支援離線快取。'}
</script></body></html>
